<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden;background:{{colors.bg}};font-family:{{fonts.sans}};color:{{colors.text}};position:relative}
.glow{position:absolute;left:50%;top:38%;width:2700px;height:1850px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,{{colors.violet}}2e 0%,{{colors.uv}}26 25%,{{colors.uv}}14 45%,{{colors.uv}}06 62%,transparent 78%);opacity:.9}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:{{colors.text}};opacity:.8}
.content{position:absolute;left:0;right:0;top:0;height:60%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 100px 0;text-align:center}
.row-keys{display:flex;gap:14px}
.row-keys:empty,p:empty,.chips:empty{display:none}
.key{display:flex;align-items:center;justify-content:center;min-width:76px;height:76px;padding:0 18px;border-radius:4px;background:linear-gradient(45deg,{{colors.violet}} 0%,{{colors.uv}} 100%);font-family:{{fonts.mono}};font-size:36px;font-weight:500;box-shadow:0 12px 40px {{colors.uv}}66}
.key+.key{background:{{colors.bg}};border:1px solid {{colors.uv}};box-shadow:none}
h1{margin:0;font-size:96px;line-height:1.02;font-weight:300;letter-spacing:-.03em}
.rule{width:140px;height:2px;background:linear-gradient(255deg,{{colors.mint}} 0%,{{colors.lime}} 100%)}
p{margin:0;font-size:30px;font-weight:400;color:{{colors.muted}}}
.chips{display:flex;gap:14px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid {{colors.uv}};font-family:{{fonts.mono}};font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:{{colors.muted}}}
.chip b{color:{{colors.lime}};font-weight:500}
/* The event history, drawn like the Temporal UI timeline graph (see card.js). */
.graph{position:absolute;left:0;right:0;bottom:64px;padding:0 48px;color:#fbfbfa;opacity:.62;font-family:{{fonts.sans}}}
.ticks i{position:absolute;top:0;bottom:0;width:1px;background:#fbfbfa;opacity:.3}
.ticks b{position:absolute;left:0;top:100%;margin-top:12px;font:12px {{fonts.mono}};font-weight:400;line-height:1;white-space:nowrap;transform:rotate(45deg);transform-origin:left center}
.baseline{position:absolute;left:48px;right:48px;bottom:0;height:6px;background:#fbfbfa;opacity:.7}
.trow{position:relative;height:34px}
.line{position:absolute;top:4.4px;height:25.2px;border-radius:9999px;background:var(--c)}
.line.dash{background:repeating-linear-gradient(to right,var(--c) 0 4.2px,transparent 4.2px 8.4px)}
.dot{position:absolute;top:2.8px;width:28px;height:28px;margin-left:-14px;border-radius:5.2px;border:2.8px solid var(--s);background:var(--f);box-sizing:border-box}
.dot svg{position:absolute;left:50%;top:50%;width:16.8px;height:16.8px;transform:translate(-50%,-50%)}
.label{position:absolute;top:50%;margin-left:20px;transform:translateY(-50%);padding:0 6px;min-height:28px;display:flex;align-items:center;border-radius:9999px;background:#191919;font-size:14px;line-height:1;white-space:nowrap}
.label.left{margin-left:0;transform:translate(calc(-100% - 20px),-50%)}
</style></head><body>
<div class="glow"></div>
<div class="stars"><i style="left:8%;top:14%"></i><i style="left:21%;top:7%"></i><i style="left:34%;top:19%"></i><i style="left:61%;top:9%"></i><i style="left:73%;top:17%"></i><i style="left:88%;top:12%"></i><i style="left:93%;top:26%"></i><i style="left:14%;top:36%"></i><i style="left:82%;top:38%"></i><i style="left:5%;top:48%"></i><i style="left:47%;top:5%"></i><i style="left:57%;top:25%"></i></div>
<div class="graph" id="graph"></div>
<div class="content">
  <div class="row-keys">{{keys}}</div>
  <h1>{{title}}</h1>
  <div class="rule"></div>
  <p>{{subtitle}}</p>
  <div class="chips">
    {{chips}}
  </div>
</div>
<script>
// The same history as card.js, drawn once.
const UI = { line: { completed: '#30a46c', running: '#0090ff', fired: '#ffa800', signaled: '#ff46a2' }, dot: { started: ['#84a7f0', '#191919'], completed: ['#30a46c', '#218358'], fired: ['#ffa800', '#ffc53d'], signaled: ['#ff46a2', '#ff8ec9'], pending: ['#191919', '#a197ff'] } };
const ICONS = {
  workflow: 'M5.208 16H0v-5.208h5.208zm8.188-5.208a2.604 2.604 0 1 1 0 5.208 2.604 2.604 0 0 1 0-5.208M1.455 14.545h2.299v-2.299h-2.3zm11.94-2.299a1.15 1.15 0 1 0 .001 2.3 1.15 1.15 0 0 0 0-2.3M9.94 14.123H6.061V12.67h3.878zM3.331 9.94H1.877V6.061H3.33zM2.604 0a2.604 2.604 0 1 1 0 5.209 2.604 2.604 0 0 1 0-5.209M16 5.208h-5.208V0H16zM2.604 1.455a1.15 1.15 0 1 0 0 2.299 1.15 1.15 0 0 0 0-2.3m9.642 2.299h2.3v-2.3h-2.3zM9.94 3.33H6.061V1.877h3.878z',
  activity: 'M8 0a8 8 0 0 1 7.975 7.396H16v1.5h-.05a8 8 0 0 1-15.9 0H0v-1.5h.025A8 8 0 0 1 8 0M6.219 5.524a.25.25 0 0 0-.462.011l-.86 2.238a1.75 1.75 0 0 1-1.633 1.123h-1.7a6.5 6.5 0 0 0 12.873 0h-1.335c-.099 0-.19.06-.229.15l-.94 2.161c-.61 1.398-2.591 1.402-3.206.007zM8 1.5a6.5 6.5 0 0 0-6.472 5.896h1.736a.25.25 0 0 0 .233-.16l.86-2.238c.56-1.458 2.605-1.508 3.235-.08l2.507 5.69a.25.25 0 0 0 .458 0l.941-2.16a1.75 1.75 0 0 1 1.604-1.052h1.37A6.5 6.5 0 0 0 8 1.5',
  signal: 'M8 1.948a2.36 2.36 0 0 1 1.782 3.904l1.53 3.384 1.364 3.016 1.394 3.082-.678.307-.678.306-1.196-2.644h-7.02l-1.173 2.66-1.362-.6 1.37-3.104 1.33-3.016 1.515-3.437a2.36 2.36 0 0 1-.533-1.495A2.36 2.36 0 0 1 8 1.948m-2.845 9.867h5.69l-.691-1.528H5.829zM6.486 8.8h2.996l-.987-2.18q-.24.054-.495.055-.283-.002-.548-.066zM14.873.037a8.07 8.07 0 0 1 .055 8.129l-1.29-.742a6.58 6.58 0 0 0-.046-6.63zM1.718.505l.644.37a6.58 6.58 0 0 0-.045 6.472l-.65.361-.65.362A8.06 8.06 0 0 1 1.071.133zm10.69.997a5.16 5.16 0 0 1 .034 5.199l-.645-.371-.645-.37a3.67 3.67 0 0 0-.025-3.7zm-8.186.432.645.372a3.67 3.67 0 0 0-.025 3.611l-.651.36-.65.362a5.16 5.16 0 0 1 .036-5.075zM8 3.436a.87.87 0 0 0-.867.875.876.876 0 0 0 .867.875.876.876 0 0 0 0-1.75',
  timer: 'M5.345 0h5v1.5h-1.75v1.544a6.45 6.45 0 0 1 3.557 1.59l.912-.915.531-.531 1.06 1.062-.532.531-.968.969A6.499 6.499 0 0 1 7.845 16a6.499 6.499 0 0 1-.75-12.956V1.5h-1.75zm2.5 14.5a5 5 0 1 0 0-10 5 5 0 0 0 0 10m.75-7.75v4h-1.5V6h1.5z',
  retry: 'M15.172 6.897H16V.276h-1.655v3.59l-.69-.81a7.7 7.7 0 0 0-5.93-2.78 7.725 7.725 0 1 0 4.634 13.903l-.993-1.324a6.07 6.07 0 1 1 1.02-8.738l.004.007.951 1.117H9.38v1.656h5.793',
};
const HISTORY = [['workflow', 'running', 0, 100, ''], ['activity', 'completed', 3, 22, 'Activity'], ['timer', 'fired', 8, 34, 'Timer'], ['activity', 'completed', 24, 47, 'Activity'], ['signal', 'signaled', 41, 41, 'Signal'], ['workflow', 'completed', 46, 68, 'Child Workflow'], ['activity', 'completed', 61, 80, 'Activity'], ['activity', 'pending', 76, 100, 'Activity']];
const icon = (n) => `<svg viewBox="0 0 16 16"><path fill="#000" d="${ICONS[n]}"/></svg>`;
const g = document.getElementById('graph');
g.style.height = `${HISTORY.length * 34 + 10}px`;
g.innerHTML = `<div class="ticks">${Array.from({ length: 9 }, (_, i) => `<i style="left:${(i + 1) * 10}%"><b>${((i + 1) * 1.2).toFixed(1)}s</b></i>`).join('')}</div>` +
  HISTORY.map(([ic, status, x1, x2, label]) => {
    const running = status === 'running' || status === 'pending', pending = status === 'pending', single = x1 === x2, left = x1 > 50;
    const c = running ? UI.line.running : UI.line[status];
    const [f1, s1] = pending ? UI.dot.pending : UI.dot.started, [f2, s2] = UI.dot[status] ?? UI.dot.completed;
    return `<div class="trow">${single ? '' : `<div class="line${running ? ' dash' : ''}" style="left:${x1}%;width:${x2 - x1}%;--c:${c}"></div>`}<div class="dot" style="left:${x1}%;--f:${f1};--s:${s1}">${icon(pending ? 'retry' : ic)}</div>${single || pending ? '' : `<div class="dot" style="left:${x2}%;--f:${f2};--s:${s2}">${icon(ic)}</div>`}${label ? `<div class="label${left ? ' left' : ''}" style="left:${left || pending ? x1 : x2}%">${label}</div>` : ''}</div>`;
  }).join('') + '<div class="baseline"></div>';
</script>
</body></html>
