name: CLI

on:
  push:
    branches: [main]
  pull_request:
    paths: ['bin/**', 'lib/**', 'scripts/**', 'tests/**', 'projects/example/**', 'requirements.txt', 'VERSION', 'README.md', '.github/workflows/cli.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg; else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - run: tests/cli_test.sh
      - run: tests/release_test.sh

  setup:
    # demo-video setup for real: the beat tracker's venv and Playwright with
    # Chromium in a fresh data folder, twice, then doctor.
    runs-on: macos-latest
    steps:
      - name: a fresh data folder
        run: echo "DEMO_VIDEO_HOME=$RUNNER_TEMP/demo-video" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: brew install ffmpeg
      - run: bin/demo setup
      - run: bin/demo setup
      - name: doctor finds the beat tracker and Playwright
        run: |
          out=$(bin/demo doctor || true)
          echo "$out"
          echo "$out" | grep -q "found    beat tracker"
          echo "$out" | grep -q "found    playwright"
