<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden;background:{{colors.bg}};font-family:{{fonts.sans}};color:{{colors.text}};position:relative}
.glow{position:absolute;left:50%;top:42%;width:3500px;height:2400px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,{{colors.violet}}30 0%,{{colors.uv}}26 28%,{{colors.uv}}12 50%,transparent 72%);filter:blur(40px);opacity:.9}
.floor{position:absolute;left:-80%;right:-80%;bottom:0;height:150%;transform-origin:50% 100%;transform:perspective(600px) rotateX(60deg);background:repeating-linear-gradient(90deg,{{colors.grid}}99 0 1px,transparent 1px 96px),repeating-linear-gradient(0deg,{{colors.grid}}99 0 1px,transparent 1px 96px);background-position:center 0,center 40px;-webkit-mask-image:linear-gradient(180deg,transparent 30%,#000 70%);mask-image:linear-gradient(180deg,transparent 30%,#000 70%)}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:{{colors.text}};opacity:.8}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 100px 150px;text-align:center}
.row{display:flex;gap:14px}
.row:empty,p:empty,.chips:empty{display:none}
.key{display:flex;align-items:center;justify-content:center;min-width:76px;height:76px;padding:0 18px;border-radius:4px;background:linear-gradient(45deg,{{colors.violet}} 0%,{{colors.uv}} 100%);font-family:{{fonts.mono}};font-size:36px;font-weight:500;box-shadow:0 12px 40px {{colors.uv}}66}
.key+.key{background:{{colors.bg}};border:1px solid {{colors.uv}};box-shadow:none}
h1{margin:0;font-size:104px;line-height:1.02;font-weight:300;letter-spacing:-.03em}
.rule{width:140px;height:2px;background:linear-gradient(255deg,{{colors.mint}} 0%,{{colors.lime}} 100%)}
p{margin:0;font-size:32px;font-weight:400;color:{{colors.muted}}}
.chips{display:flex;gap:14px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid {{colors.uv}};font-family:{{fonts.mono}};font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:{{colors.muted}}}
.chip b{color:{{colors.lime}};font-weight:500}
</style></head><body>
<div class="glow"></div>
<div class="floor"></div>
<div class="stars"><i style="left:8%;top:18%"></i><i style="left:21%;top:9%"></i><i style="left:34%;top:24%"></i><i style="left:61%;top:12%"></i><i style="left:73%;top:21%"></i><i style="left:88%;top:15%"></i><i style="left:93%;top:31%"></i><i style="left:14%;top:42%"></i><i style="left:82%;top:44%"></i><i style="left:5%;top:55%"></i></div>
<div class="content">
  <div class="row">{{keys}}</div>
  <h1>{{title}}</h1>
  <div class="rule"></div>
  <p>{{subtitle}}</p>
  <div class="chips">
    {{chips}}
  </div>
</div>
</body></html>
