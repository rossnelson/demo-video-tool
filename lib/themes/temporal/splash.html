<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden;background:{{colors.bg}};font-family:{{fonts.sans}};color:{{colors.text}};position:relative}
.glow{position:absolute;left:50%;top:38%;width:2700px;height:1850px;transform:translate(-50%,-50%);background:{{colors.glow}};opacity:.9}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:{{colors.star}};opacity:.8}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 100px 40px;text-align:center}
.row-keys{display:flex;gap:14px}
.row-keys:empty,p:empty,.chips:empty{display:none}
.key{display:flex;align-items:center;justify-content:center;min-width:76px;height:76px;padding:0 18px;border-radius:4px;background:linear-gradient(45deg,{{colors.violet}} 0%,{{colors.uv}} 100%);color:{{colors.onAccent}};font-family:{{fonts.mono}};font-size:36px;font-weight:500;box-shadow:0 12px 40px {{colors.uv}}66}
.key+.key{background:{{colors.bg}};color:{{colors.text}};border:1px solid {{colors.uv}};box-shadow:none}
h1{margin:0;font-size:96px;line-height:1.02;font-weight:300;letter-spacing:-.03em}
.rule{width:140px;height:2px;background:linear-gradient(255deg,{{colors.mint}} 0%,{{colors.lime}} 100%)}
p{margin:0;font-size:30px;font-weight:400;color:{{colors.muted}}}
.chips{display:flex;gap:14px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid {{colors.uv}};font-family:{{fonts.mono}};font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:{{colors.muted}}}
.chip b{color:{{colors.lime}};font-weight:500}
</style></head><body>
<div class="glow"></div>
<div class="stars"><i style="left:8%;top:14%"></i><i style="left:21%;top:7%"></i><i style="left:34%;top:19%"></i><i style="left:61%;top:9%"></i><i style="left:73%;top:17%"></i><i style="left:88%;top:12%"></i><i style="left:93%;top:26%"></i><i style="left:14%;top:36%"></i><i style="left:82%;top:38%"></i><i style="left:5%;top:48%"></i><i style="left:47%;top:5%"></i><i style="left:57%;top:25%"></i></div>
<div class="content">
  <div class="row-keys">{{keys}}</div>
  <h1>{{title}}</h1>
  <div class="rule"></div>
  <p>{{subtitle}}</p>
  <div class="chips">
    {{chips}}
  </div>
</div>
</body></html>
