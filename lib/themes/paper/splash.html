<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden;background:{{colors.bg}};font-family:{{fonts.serif}};color:{{colors.text}}}
.grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.rule{width:640px;height:1px;background:{{colors.rule}}}
.row{display:flex;gap:18px}
.row:empty,p:empty,.chips:empty{display:none}
.key{display:flex;align-items:center;justify-content:center;min-width:84px;height:84px;padding:0 18px;border:1.5px solid {{colors.text}};border-radius:12px;font-size:40px}
h1{margin:0;font-size:104px;line-height:1.05;font-weight:500;letter-spacing:-.01em}
p{margin:0;font-size:34px;font-style:italic;color:{{colors.muted}}}
.orn{color:{{colors.accent}};font-size:22px;letter-spacing:.5em}
.chips{display:flex;gap:28px;font-family:{{fonts.sans}}}
.chip{font-size:20px;color:{{colors.muted}};letter-spacing:.02em}
.chip b{color:{{colors.text}};font-weight:600}
</style></head><body>
<svg class="grain" width="100%" height="100%"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .42 0 0 0 .18 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
<div class="card">
  <div class="rule"></div>
  <div class="row">{{keys}}</div>
  <h1>{{title}}</h1>
  <p>{{subtitle}}</p>
  <div class="orn">❦</div>
  <div class="chips">
    {{chips}}
  </div>
  <div class="rule"></div>
</div>
</body></html>
