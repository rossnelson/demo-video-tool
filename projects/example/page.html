<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Notes</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:grid;grid-template-columns:260px 1fr;font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;color:#1a1a2e;background:#f6f6fb}
  nav{background:#1d1b3a;color:#d8d6ff;padding:28px 22px}
  nav h2{margin:0 0 18px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#b8f5dc}
  nav a{display:block;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none}
  nav a.active{background:#444ce7;color:#fff}
  main{padding:40px 56px;max-width:760px}
  h1{margin:0 0 6px;font-size:34px;letter-spacing:-.02em}
  p.lede{margin:0 0 28px;color:#5b5b7a}
  form{display:flex;gap:10px;margin-bottom:24px}
  input{flex:1;font:inherit;padding:12px 14px;border:1px solid #c9c9d6;border-radius:10px;background:#fff}
  button{font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:10px;background:#444ce7;color:#fff;cursor:pointer}
  button.done{background:#1ff1a5;color:#0b0b14}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid #e3e3ee;border-radius:12px;margin-bottom:10px}
  li.done span{text-decoration:line-through;color:#8a8aa3}
  li button{padding:8px 12px;font-size:14px}
</style></head>
<body>
<nav>
  <h2>Notes</h2>
  <a class="active" href="#">Today</a><a href="#">Later</a><a href="#">Done</a>
</nav>
<main>
  <h1>Today</h1>
  <p class="lede">A small page to record. Add a note, then mark it done.</p>
  <form id="add"><input id="text" placeholder="What needs doing?" autocomplete="off"><button type="submit">Add</button></form>
  <ul id="list">
    <li><span>Write the narration</span><button>Done</button></li>
    <li><span>Pick the music</span><button>Done</button></li>
  </ul>
</main>
<script>
  const list = document.getElementById('list');
  document.getElementById('add').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('text');
    if (!input.value.trim()) return;
    const li = document.createElement('li');
    li.innerHTML = '<span></span><button>Done</button>';
    li.querySelector('span').textContent = input.value;
    list.prepend(li);
    input.value = '';
  });
  list.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    e.target.closest('li').classList.toggle('done');
    e.target.classList.toggle('done');
  });
</script>
</body></html>
