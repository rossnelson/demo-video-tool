<!doctype html>
<!-- The site's share image, 1200 × 630, in the site's look (site/src/app.css).
     demo-video's splash command fills {{title}}, {{subtitle}} and {{url}}.
     The page is written to share/build/, so the fonts are two folders up. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/schibsted-grotesk/wght.css">
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/jetbrains-mono/wght.css">
<style>
:root{--bg:#f5f2ec;--raised:#ebe6dc;--code:#efeae1;--ink:#1c1a17;--ink-2:#57514a;--ink-3:#7a7369;--rule:#d8d0c2;--rule-strong:#b9b0a1;--cut:#b83b1a;
  --sans:'Schibsted Grotesk Variable',ui-sans-serif,system-ui,sans-serif;--mono:'JetBrains Mono Variable',ui-monospace,Menlo,monospace}
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.page{position:absolute;inset:0;padding:64px 72px 0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font:600 26px var(--mono);letter-spacing:-.01em}
.brand svg{width:36px;height:26px;fill:var(--ink)}
.brand .cut{fill:var(--cut)}
h1{margin:40px 0 0;font-size:76px;line-height:1.02;font-weight:700;letter-spacing:-.03em;max-width:880px}
p{margin:22px 0 0;font-size:25px;line-height:1.4;color:var(--ink-2);max-width:820px}
code{display:inline-block;margin-top:26px;align-self:flex-start;padding:10px 18px;border:1px solid var(--rule);border-radius:8px;background:var(--code);font:500 21px var(--mono);color:var(--ink)}
code b{color:var(--ink-3);font-weight:500;margin-right:12px}
.ruler{position:absolute;left:72px;right:72px;bottom:44px}
.ruler svg{display:block;width:100%;height:auto;overflow:visible}
.fill{fill:var(--raised);stroke:var(--rule-strong);stroke-width:1}
.scene text{font:500 13px var(--mono);fill:var(--ink);white-space:pre}
line{stroke:var(--rule-strong);stroke-width:1}
line.down{stroke:var(--ink-2);stroke-width:1.5}
.cutmark line{stroke:var(--cut);stroke-width:2}
.cutmark path{fill:var(--cut)}
</style></head><body>
<div class="page">
  <div class="brand">
    <svg viewBox="0 0 22 16" aria-hidden="true"><rect x="0" y="1" width="2" height="14" rx="1"/><rect x="6" y="5" width="2" height="6" rx="1"/><rect x="12" y="5" width="2" height="6" rx="1"/><rect class="cut" x="18" y="0" width="2.5" height="16" rx="1.25"/></svg>
    demo-video
  </div>
  <h1>{{title}}</h1>
  <p>{{subtitle}}</p>
  <code><b>$</b>{{url}}</code>
</div>
<!-- Four bars of music, three scenes, a red cut on each downbeat where a scene ends (as BeatRuler.svelte). -->
<div class="ruler">
  <svg viewBox="-2 0 1060 64">
    <g class="scene"><rect class="fill" x="0" y="12" width="263" height="30" rx="5"/><text x="12" y="31.5">intro</text></g>
    <g class="scene"><rect class="fill" x="267" y="12" width="524" height="30" rx="5"/><text x="279" y="31.5">01  Add a note</text></g>
    <g class="scene"><rect class="fill" x="795" y="12" width="261" height="30" rx="5"/><text x="807" y="31.5">end</text></g>
    <g id="ticks"></g>
    <g class="cutmark"><line x1="265" x2="265" y1="6" y2="62"/><path d="M259 0h12l-6 7z"/></g>
    <g class="cutmark"><line x1="793" x2="793" y1="6" y2="62"/><path d="M787 0h12l-6 7z"/></g>
  </svg>
</div>
<script>
  // 16 beats over four bars of 264 units; the downbeats are longer.
  const g = document.getElementById('ticks');
  for (let i = 0; i <= 16; i++) {
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    const x = i * 66, down = i % 4 === 0;
    l.setAttribute('x1', x); l.setAttribute('x2', x);
    l.setAttribute('y1', down ? 48 : 52); l.setAttribute('y2', 62);
    if (down) l.setAttribute('class', 'down');
    g.appendChild(l);
  }
</script>
</body></html>
