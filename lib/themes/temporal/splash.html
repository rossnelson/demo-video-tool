<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden;background:{{colors.bg}};font-family:{{fonts.sans}};color:{{colors.text}};position:relative}
.glow{position:absolute;left:50%;top:38%;width:1500px;height:950px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,{{colors.violet}}55 0%,{{colors.uv}}40 35%,transparent 70%);filter:blur(10px)}
svg.grid{position:absolute;inset:0;width:100%;height:100%}
svg.grid line{stroke:{{colors.grid}};stroke-width:1;stroke-opacity:.45}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:{{colors.text}};opacity:.8}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 100px 150px;text-align:center}
.row{display:flex;gap:14px}
.row:empty,p:empty,.chips:empty{display:none}
.key{display:flex;align-items:center;justify-content:center;min-width:76px;height:76px;padding:0 18px;border-radius:4px;background:linear-gradient(45deg,{{colors.violet}} 0%,{{colors.uv}} 100%);font-family:{{fonts.mono}};font-size:36px;font-weight:500;box-shadow:0 12px 40px {{colors.uv}}66}
.key+.key{background:{{colors.bg}};border:1px solid {{colors.uv}};box-shadow:none}
h1{margin:0;font-size:104px;line-height:1.02;font-weight:300;letter-spacing:-.03em}
.rule{width:140px;height:2px;background:linear-gradient(255deg,{{colors.mint}} 0%,{{colors.lime}} 100%)}
p{margin:0;font-size:32px;font-weight:400;color:{{colors.muted}}}
.chips{display:flex;gap:14px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid {{colors.uv}};font-family:{{fonts.mono}};font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:{{colors.muted}}}
.chip b{color:{{colors.lime}};font-weight:500}
</style></head><body>
<div class="glow"></div>
<svg class="grid" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{colors.bg}}"/><stop offset=".45" stop-color="{{colors.bg}}" stop-opacity="0"/></linearGradient></defs>
  <g><line x1="800" y1="610" x2="-2840" y2="900"/><line x1="800" y1="610" x2="-2580" y2="900"/><line x1="800" y1="610" x2="-2320" y2="900"/><line x1="800" y1="610" x2="-2060" y2="900"/><line x1="800" y1="610" x2="-1800" y2="900"/><line x1="800" y1="610" x2="-1540" y2="900"/><line x1="800" y1="610" x2="-1280" y2="900"/><line x1="800" y1="610" x2="-1020" y2="900"/><line x1="800" y1="610" x2="-760" y2="900"/><line x1="800" y1="610" x2="-500" y2="900"/><line x1="800" y1="610" x2="-240" y2="900"/><line x1="800" y1="610" x2="20" y2="900"/><line x1="800" y1="610" x2="280" y2="900"/><line x1="800" y1="610" x2="540" y2="900"/><line x1="800" y1="610" x2="800" y2="900"/><line x1="800" y1="610" x2="1060" y2="900"/><line x1="800" y1="610" x2="1320" y2="900"/><line x1="800" y1="610" x2="1580" y2="900"/><line x1="800" y1="610" x2="1840" y2="900"/><line x1="800" y1="610" x2="2100" y2="900"/><line x1="800" y1="610" x2="2360" y2="900"/><line x1="800" y1="610" x2="2620" y2="900"/><line x1="800" y1="610" x2="2880" y2="900"/><line x1="800" y1="610" x2="3140" y2="900"/><line x1="800" y1="610" x2="3400" y2="900"/><line x1="800" y1="610" x2="3660" y2="900"/><line x1="800" y1="610" x2="3920" y2="900"/><line x1="800" y1="610" x2="4180" y2="900"/><line x1="800" y1="610" x2="4440" y2="900"/><line x1="-200" y1="653.1" x2="1800" y2="653.1"/><line x1="-200" y1="662.3" x2="1800" y2="662.3"/><line x1="-200" y1="677.8" x2="1800" y2="677.8"/><line x1="-200" y1="699.4" x2="1800" y2="699.4"/><line x1="-200" y1="727.2" x2="1800" y2="727.2"/><line x1="-200" y1="761.1" x2="1800" y2="761.1"/><line x1="-200" y1="801.2" x2="1800" y2="801.2"/><line x1="-200" y1="847.5" x2="1800" y2="847.5"/><line x1="-200" y1="900.0" x2="1800" y2="900.0"/></g>
  <rect x="0" y="610" width="1600" height="290" fill="url(#fade)"/>
</svg>
<div class="stars"><i style="left:8%;top:18%"></i><i style="left:21%;top:9%"></i><i style="left:34%;top:24%"></i><i style="left:61%;top:12%"></i><i style="left:73%;top:21%"></i><i style="left:88%;top:15%"></i><i style="left:93%;top:31%"></i><i style="left:14%;top:42%"></i><i style="left:82%;top:44%"></i><i style="left:5%;top:55%"></i></div>
<div class="content">
  <div class="row">{{keys}}</div>
  <h1>{{title}}</h1>
  <div class="rule"></div>
  <p>{{subtitle}}</p>
  <div class="chips">
    {{chips}}
  </div>
</div>
</body></html>
